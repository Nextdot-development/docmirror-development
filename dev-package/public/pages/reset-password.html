<style>
:root{--navy:#0A2540;--green:#00A878;--green-light:#e6f7f2;--warm:#F7F6F3;--slate:#3D4D5C;--slate-light:#6B7A8D;--border:#E2E8F0;--red:#DC2626}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--slate);background:var(--warm);min-height:100vh;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
nav{background:#fff;border-bottom:1px solid var(--border);padding:0 clamp(1rem,4vw,2rem);height:60px;display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none}
.logo-mark{width:32px;height:32px;background:var(--navy);border-radius:8px;display:flex;align-items:center;justify-content:center}
.logo-mark svg{width:18px;height:18px}
.logo-word{font-size:16px;font-weight:700;color:var(--navy);letter-spacing:-.02em}.logo-word span{color:var(--green)}
.back-link{font-size:.85rem;color:var(--slate-light);text-decoration:none}
main{flex:1;display:flex;align-items:flex-start;justify-content:center;padding:3rem clamp(1rem,4vw,2rem) 5rem}
.auth-card{background:#fff;border:1px solid var(--border);border-radius:20px;padding:2.25rem;width:100%;max-width:420px}
.auth-card h1{font-size:1.45rem;font-weight:800;color:var(--navy);margin-bottom:.3rem}
.auth-card .sub{font-size:.9rem;color:var(--slate-light);margin-bottom:1.75rem}
.field-label{font-size:.8rem;font-weight:600;color:var(--slate);margin-bottom:.4rem;display:block}
.field-input{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:8px;font-size:.93rem;font-family:inherit;color:var(--navy);outline:none;transition:border-color .15s;margin-bottom:1rem}
.field-input:focus{border-color:var(--navy)}
.submit-btn{width:100%;padding:13px;background:var(--navy);color:#fff;border:none;border-radius:10px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit;margin-top:.5rem;transition:background .15s}
.submit-btn:hover:not(:disabled){background:#0e3060}
.submit-btn:disabled{opacity:.6;cursor:not-allowed}
.msg{padding:.75rem 1rem;border-radius:8px;font-size:.88rem;margin-top:1rem;display:none}
.msg.error{background:#fef2f2;color:var(--red);border:1px solid #fecaca;display:block}
.msg.success{background:var(--green-light);color:#065f46;border:1px solid #a7f3d0;display:block}
.switch-link{text-align:center;font-size:.83rem;color:var(--slate-light);margin-top:1rem}
.switch-link a{color:var(--green);font-weight:600;text-decoration:none}
#loading{text-align:center;color:var(--slate-light);font-size:.9rem;padding:1rem 0}
footer{text-align:center;padding:1.5rem;font-size:.78rem;color:var(--slate-light)}
footer a{color:var(--slate-light)}
@media(max-width:480px){
  nav{padding:0 1rem;height:56px}
  main{padding:1.5rem 1rem 3rem}
  .auth-card{padding:1.5rem;border-radius:16px}
}

<body>
<nav>
  <a href="/" class="logo">
    <div class="logo-mark"><svg viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="7.5" stroke="#00A878" stroke-width="1.3"/><path d="M5.5 9C5.5 7 7 5.5 9 5.5S12.5 7 12.5 9" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/><circle cx="9" cy="12" r="1.3" fill="#00A878"/></svg></div>
    <span class="logo-word">The Doc <span>Mirror</span></span>
  </a>
  <a href="/pages/auth.html?tab=login" class="back-link">← Back to login</a>
</nav>

<main>
  <div class="auth-card">
    <h1 id="card-title">Set a new password</h1>
    <p class="sub" id="card-sub">Choose a new password for your account.</p>

    <div id="loading">Verifying your reset link…</div>

    <!-- New password form (shown once a valid recovery link is detected) -->
    <div id="form" style="display:none">
      <label class="field-label" for="np">New Password</label>
      <input class="field-input" id="np" type="password" placeholder="Minimum 8 characters" autocomplete="new-password">

      <label class="field-label" for="np2">Confirm Password</label>
      <input class="field-input" id="np2" type="password" placeholder="Re-enter password" autocomplete="new-password">

      <button class="submit-btn" id="save-btn" onclick="savePassword()">Update Password</button>
      <div class="msg" id="msg"></div>
    </div>

    <!-- Invalid / expired link -->
    <div id="invalid" style="display:none">
      <div class="msg error" style="display:block">This reset link is invalid or has expired.</div>
      <div class="switch-link"><a href="/pages/auth.html?tab=login">Request a new reset link →</a></div>
    </div>
  </div>
</main>

<footer>
  <a href="/privacy">Privacy</a> &nbsp;·&nbsp; <a href="/terms">Terms</a>
</footer>

<script>
var _supabase = null;
var _recoveryReady = false;

function el(id){ return document.getElementById(id); }
function showMsg(text, type){ var m = el('msg'); m.textContent = text; m.className = 'msg ' + type; }

function showForm(){ el('loading').style.display='none'; el('invalid').style.display='none'; el('form').style.display='block'; _recoveryReady=true; }
function showInvalid(){ el('loading').style.display='none'; el('form').style.display='none'; el('invalid').style.display='block'; }

async function init(){
  try {
    var cfg = await fetch('/api/client-config').then(function(r){ return r.json(); });
    if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) { showInvalid(); return; }
    _supabase = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);

    // supabase-js parses the recovery token from the URL and fires PASSWORD_RECOVERY.
    _supabase.auth.onAuthStateChange(function(event, session){
      if (event === 'PASSWORD_RECOVERY' || (session && !_recoveryReady)) showForm();
    });

    // Fallback: token may already be parsed into a session by the time we check.
    setTimeout(async function(){
      if (_recoveryReady) return;
      var s = await _supabase.auth.getSession();
      if (s.data.session) showForm();
      else showInvalid();
    }, 1200);

  } catch(e) {
    console.error('reset init error', e);
    showInvalid();
  }
}

async function savePassword(){
  var p1 = el('np').value;
  var p2 = el('np2').value;
  if (!p1 || p1.length < 8) { showMsg('Password must be at least 8 characters.', 'error'); return; }
  if (p1 !== p2) { showMsg('Passwords do not match.', 'error'); return; }

  var btn = el('save-btn');
  btn.disabled = true; btn.textContent = 'Updating…';
  showMsg('', '');

  try {
    var { error } = await _supabase.auth.updateUser({ password: p1 });
    if (error) {
      showMsg(error.message || 'Could not update password. Your link may have expired.', 'error');
      btn.disabled = false; btn.textContent = 'Update Password';
      return;
    }
    showMsg('Password updated! Redirecting to login…', 'success');
    // Sign out the temporary recovery session, then send them to log in fresh.
    try { await _supabase.auth.signOut(); } catch(_) {}
    ['tdm_access_token','tdm_refresh_token','tdm_user_id','tdm_user_email'].forEach(function(k){ try{ localStorage.removeItem(k); }catch(_){} });
    setTimeout(function(){ window.location.replace('/pages/auth.html?tab=login'); }, 1500);
  } catch(e) {
    showMsg('Network error. Please try again.', 'error');
    btn.disabled = false; btn.textContent = 'Update Password';
  }
}

document.addEventListener('keydown', function(e){ if (e.key === 'Enter' && _recoveryReady) savePassword(); });

init();
</script>
